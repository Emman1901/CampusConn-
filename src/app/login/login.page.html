<ion-content [fullscreen]="true" class="login-page">
  <div class="aurora">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <div class="login-shell cc-animate-in">
    <header class="login-top">
      <ion-back-button defaultHref="/home" text="Book a tour" class="back-link"></ion-back-button>
    </header>

    <section class="login-hero">
      <div class="logo-badge">
        <img src="assets/images/LogoMinSU.jpg" alt="MinSU Logo" />
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to your CampusConn account to continue.</p>
    </section>

    <section class="login-card">
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        <label class="cc-field-label" for="login-username">Username or email</label>
        <ion-item class="cc-field" lines="none">
          <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            id="login-username"
            type="text"
            placeholder="juan.delacruz@msu.edu.ph"
            autocomplete="username"
            [(ngModel)]="usernameOrEmail"
            name="usernameOrEmail"
          ></ion-input>
        </ion-item>

        <div class="label-row">
          <label class="cc-field-label" for="login-password">Password</label>
          <ion-text class="forgot-link" (click)="onForgotPassword()" role="button" tabindex="0">Forgot?</ion-text>
        </div>
        <ion-item class="cc-field" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            id="login-password"
            [type]="passwordType"
            placeholder="Your password"
            autocomplete="current-password"
            [(ngModel)]="passwordInput"
            name="passwordInput"
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="passwordToggleIcon"
            (click)="togglePasswordVisibility()"
            class="password-toggle"
            role="button"
            tabindex="0"
            [attr.aria-label]="passwordType === 'password' ? 'Show password' : 'Hide password'"
          ></ion-icon>
        </ion-item>

        <ion-button type="submit" expand="block" class="cc-btn-primary login-cta" (click)="onLogin()">
          Sign in
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>
      </form>

      <div class="divider"><span>or</span></div>

      <p class="signup-row">
        New to CampusConn?
        <ion-text color="primary" class="signup-link" (click)="onSignUp()" role="button" tabindex="0">
          Create an account
        </ion-text>
      </p>
    </section>
  </div>
</ion-content>
