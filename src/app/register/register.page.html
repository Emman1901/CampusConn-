<ion-content [fullscreen]="true" class="register-page">
  <div class="aurora">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
  </div>

  <div class="register-shell cc-animate-in">
    <header class="register-top">
      <ion-back-button defaultHref="/login" text="Back" class="back-link"></ion-back-button>
    </header>

    <section class="register-hero">
      <div class="logo-badge">
        <img src="assets/images/LogoMinSU.jpg" alt="MinSU Logo" />
      </div>
      <h1>Create your account</h1>
      <p>Register to access campus navigation, announcements and more.</p>
    </section>

    <section class="register-card">
      <form (ngSubmit)="onRegister()">

        <div class="grid-2">
          <div>
            <label class="cc-field-label" for="reg-first">First name</label>
            <ion-item class="cc-field" lines="none">
              <ion-input id="reg-first" type="text" placeholder="Juan" [(ngModel)]="firstName" name="firstName"></ion-input>
            </ion-item>
          </div>
          <div>
            <label class="cc-field-label" for="reg-last">Last name</label>
            <ion-item class="cc-field" lines="none">
              <ion-input id="reg-last" type="text" placeholder="Dela Cruz" [(ngModel)]="lastName" name="lastName"></ion-input>
            </ion-item>
          </div>
        </div>

        <label class="cc-field-label" for="reg-id">Student ID</label>
        <ion-item class="cc-field" lines="none">
          <ion-icon name="card-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input id="reg-id" type="text" placeholder="2021-00123" [(ngModel)]="studentId" name="studentId"></ion-input>
        </ion-item>

        <label class="cc-field-label" for="reg-email">University email</label>
        <ion-item class="cc-field email-field" lines="none">
          <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            id="reg-email"
            type="email"
            placeholder="your-email"
            [(ngModel)]="universityEmail"
            [ngModelOptions]="{standalone: true}"
            class="email-prefix-input"
          ></ion-input>
          <ion-text class="email-suffix" slot="end">&#64;msu.edu.ph</ion-text>
        </ion-item>

        <label class="cc-field-label" for="reg-pass">Password</label>
        <ion-item class="cc-field" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            id="reg-pass"
            [type]="passwordType"
            placeholder="Create a strong password"
            [(ngModel)]="password"
            name="password"
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="passwordToggleIcon"
            (click)="togglePasswordVisibility('password')"
            class="password-toggle"
            role="button"
            tabindex="0"
          ></ion-icon>
        </ion-item>

        <label class="cc-field-label" for="reg-pass-confirm">Confirm password</label>
        <ion-item class="cc-field" lines="none" [class.cc-field--error]="showMismatchError">
          <ion-icon name="shield-checkmark-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-input
            id="reg-pass-confirm"
            [type]="confirmPasswordType"
            placeholder="Repeat your password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            (ionChange)="checkPasswordMatch()"
          ></ion-input>
          <ion-icon
            slot="end"
            [name]="passwordToggleIcon"
            (click)="togglePasswordVisibility('confirm')"
            class="password-toggle"
            role="button"
            tabindex="0"
          ></ion-icon>
        </ion-item>

        <p class="error-text" *ngIf="showMismatchError">
          <ion-icon name="alert-circle-outline"></ion-icon>
          Passwords do not match.
        </p>

        <ion-button type="submit" expand="block" class="cc-btn-primary register-cta" (click)="onRegister()">
          Create account
          <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
        </ion-button>

        <p class="terms-line">
          By creating an account, you agree to MinSU&apos;s <a href="#" (click)="$event.preventDefault()">terms</a>
          &amp; <a href="#" (click)="$event.preventDefault()">privacy policy</a>.
        </p>
      </form>

      <div class="divider"><span>or</span></div>

      <p class="signin-row">
        Already have an account?
        <ion-text color="primary" class="signin-link" (click)="onSignIn()" role="button" tabindex="0">
          Sign in
        </ion-text>
      </p>
    </section>
  </div>
</ion-content>
